<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0a1630" />
      <stop offset="60%" stop-color="#040914" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Neon Ring Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#38ef7d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#FFE259" />
      <stop offset="75%" stop-color="#FFA751" />
      <stop offset="100%" stop-color="#B85B00" />
    </linearGradient>

    <!-- Gold Edge/Border Gradient -->
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE259" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFA751" />
    </linearGradient>

    <!-- CapCut Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8.0" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Circle base -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#0f172a" stroke-width="4" />

  <!-- Outer Neon Rings -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#00d2ff" stroke-width="2.5" opacity="0.4" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#neonGrad)" stroke-width="6" filter="url(#neonGlow)" />

  <!-- Decorative Rays / Lines in Background -->
  <g opacity="0.15" stroke="#00d2ff" stroke-width="1.5">
    <line x1="256" y1="44" x2="256" y2="468" />
    <line x1="44" y1="256" x2="468" y2="256" />
    <line x1="106" y1="106" x2="406" y2="406" />
    <line x1="106" y1="406" x2="406" y2="106" />
  </g>

  
  <!-- Stylized Curved Film Strip (Left) -->
  <g transform="translate(65, 230) rotate(-28)" opacity="0.75" filter="url(#dropShadow)">
    <rect x="0" y="0" width="130" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Film Holes Top -->
    <rect x="8" y="4" width="8" height="6" rx="1" fill="#64748b"/>
    <rect x="28" y="4" width="8" height="6" rx="1" fill="#64748b"/>
    <rect x="48" y="4" width="8" height="6" rx="1" fill="#64748b"/>
    <rect x="68" y="4" width="8" height="6" rx="1" fill="#64748b"/>
    <rect x="88" y="4" width="8" height="6" rx="1" fill="#64748b"/>
    <rect x="108" y="4" width="8" height="6" rx="1" fill="#64748b"/>
    <!-- Film Holes Bottom -->
    <rect x="8" y="24" width="8" height="6" rx="1" fill="#64748b"/>
    <rect x="28" y="24" width="8" height="6" rx="1" fill="#64748b"/>
    <rect x="48" y="24" width="8" height="6" rx="1" fill="#64748b"/>
    <rect x="68" y="24" width="8" height="6" rx="1" fill="#64748b"/>
    <rect x="88" y="24" width="8" height="6" rx="1" fill="#64748b"/>
    <rect x="108" y="24" width="8" height="6" rx="1" fill="#64748b"/>
  </g>
  

  
  <!-- Stylized CapCut Scissor/Hourglass Logo Vector -->
  <g transform="translate(256, 175) scale(1.15)" filter="url(#dropShadow)">
    <!-- Right Blade/Trapezoid -->
    <path d="M 10 -45 L 55 -15 L 40 25 L -5 -5 Z" fill="#FFFFFF" opacity="0.95" />
    <!-- Left Blade/Trapezoid -->
    <path d="M -10 -45 L -55 -15 L -40 25 L 5 -5 Z" fill="#FFFFFF" opacity="0.95" />
    <!-- Bottom Right Connector -->
    <path d="M 5 5 L 45 35 L 25 50 L -15 20 Z" fill="url(#cyanGrad)" />
    <!-- Bottom Left Connector -->
    <path d="M -5 5 L -45 35 L -25 50 L 15 20 Z" fill="url(#cyanGrad)" />
  </g>
  

  
  <!-- Floating App UI Element Icons -->
  <!-- Play Icon Box -->
  <g transform="translate(375, 140)" filter="url(#neonGlow)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#091328" stroke="#00d2ff" stroke-width="1.5"/>
    <polygon points="14,11 26,18 14,25" fill="#00d2ff"/>
  </g>

  <!-- Music Note Box -->
  <g transform="translate(390, 200)" filter="url(#neonGlow)">
    <rect x="0" y="0" width="32" height="32" rx="9" fill="#091328" stroke="#00d2ff" stroke-width="1.5"/>
    <path d="M 18 10 L 22 10 L 22 20 A 3 3 0 1 1 19 17 L 19 12 L 14 13 L 14 22 A 3 3 0 1 1 11 19 L 11 11 Z" fill="#00d2ff"/>
  </g>

  <!-- Scissors Box -->
  <g transform="translate(355, 255)" filter="url(#neonGlow)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#091328" stroke="#00d2ff" stroke-width="1.5"/>
    <path d="M 10 12 A 2.5 2.5 0 1 0 10 17 A 2.5 2.5 0 1 0 10 12 Z M 10 21 A 2.5 2.5 0 1 0 10 26 A 2.5 2.5 0 1 0 10 21 Z M 13 15.5 L 24 11 M 13 22.5 L 24 27 M 15 19 L 20 19" stroke="#00d2ff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>
  

  
  <!-- Gold Royal Crown above 'K' -->
  <g transform="translate(285, 280) scale(0.85)" filter="url(#dropShadow)">
    <path d="M 0 18 L 8 0 L 18 12 L 28 -4 L 38 12 L 48 0 L 56 18 Z" fill="url(#goldEdge)" />
    <rect x="2" y="19" width="52" height="5" rx="2" fill="#FFE259" />
    <!-- Crown Jewels -->
    <circle cx="8" cy="0" r="2.5" fill="#FFFFFF"/>
    <circle cx="28" cy="-4" r="3" fill="#FFFFFF"/>
    <circle cx="48" cy="0" r="2.5" fill="#FFFFFF"/>
  </g>
  

  <!-- Main 'CapKut' Typography -->
  <g filter="url(#dropShadow)">
    <!-- Dark Gold 3D Backing/Shadow Text -->
    <text x="258" y="373" 
          font-family="'Satisfy', 'Brush Script MT', cursive, sans-serif" 
          font-size="94" 
          font-weight="bold" 
          font-style="italic" 
          text-anchor="middle" 
          fill="#4A2300" 
          stroke="#261100" 
          stroke-width="12" 
          stroke-linejoin="round">
      CapKut
    </text>

    <!-- Outer Gold Border Text -->
    <text x="256" y="370" 
          font-family="'Satisfy', 'Brush Script MT', cursive, sans-serif" 
          font-size="94" 
          font-weight="bold" 
          font-style="italic" 
          text-anchor="middle" 
          fill="none" 
          stroke="url(#goldEdge)" 
          stroke-width="7" 
          stroke-linejoin="round">
      CapKut
    </text>

    <!-- Front Glossy Gradient Text -->
    <text x="256" y="370" 
          font-family="'Satisfy', 'Brush Script MT', cursive, sans-serif" 
          font-size="94" 
          font-weight="bold" 
          font-style="italic" 
          text-anchor="middle" 
          fill="url(#goldGrad)">
      CapKut
    </text>
  </g>

  <!-- Golden Bottom Banner Arc Accent -->
  <path d="M 130 380 Q 256 425 382 380 Q 256 412 130 380 Z" fill="url(#goldEdge)" filter="url(#dropShadow)"/>

</svg>